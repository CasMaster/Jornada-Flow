name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [homologacao, producao]
        required: true
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publicar pacote pelo SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          tar -C laravel-app -czf /tmp/hibrido.tgz .
          scp /tmp/hibrido.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/hibrido.tgz"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf /tmp/hibrido.tgz -C '$TARGET_DIR' && cd '$TARGET_DIR' && sh deploy.sh"
      - name: Validar ambiente publicado
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ "${{ inputs.environment }}" = "homologacao" ]; then
            export SMOKE_ROUTE_PREFIX=/homologacao
          fi
          sh scripts/smoke-environment.sh
