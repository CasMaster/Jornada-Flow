name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [homologacao, producao]
        required: true
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publicar pacote pelo SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ inputs.environment }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          tar -C laravel-app -czf /tmp/hibrido.tgz . -C .. scripts/backup-postgres.sh
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy-$DEPLOY_TARGET" < /tmp/hibrido.tgz
      - name: Validar ambiente publicado
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ "${{ inputs.environment }}" = "homologacao" ]; then
            export SMOKE_ROUTE_PREFIX=/homologacao
          fi
          sh scripts/smoke-environment.sh
