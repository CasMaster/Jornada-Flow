name: Smoke test
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [homologacao, producao]
        required: true
jobs:
  smoke:
    environment: ${{ github.event_name == 'schedule' && 'producao' || inputs.environment }}
    concurrency:
      group: smoke-${{ github.event_name == 'schedule' && 'producao' || inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar ambiente publicado
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ "${{ github.event_name == 'schedule' && 'producao' || inputs.environment }}" = "homologacao" ]; then
            export SMOKE_ROUTE_PREFIX=/homologacao
          fi
          sh scripts/smoke-environment.sh
