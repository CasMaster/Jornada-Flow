services:
  hibrido:
    build: .
    container_name: hibrido-home-office
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      HIBRIDO_MANAGER_PIN: "${HIBRIDO_MANAGER_PIN}"
      HIBRIDO_TIMEZONE: "${HIBRIDO_TIMEZONE:-America/Sao_Paulo}"
    volumes:
      - hibrido_data:/var/www/html/data

volumes:
  hibrido_data:
