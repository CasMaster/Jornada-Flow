services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: "${POSTGRES_CONTAINER_NAME:-hibrido-home-office-postgres}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-hibrido}"
      POSTGRES_USER: "${DB_USERNAME:-hibrido}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - hibrido_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hibrido} -d ${DB_DATABASE:-hibrido}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hibrido_laravel:
    build: .
    container_name: "${APP_CONTAINER_NAME:-hibrido-home-office-laravel}"
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8081}:80"
    environment:
      APP_NAME: "Híbrido | Mix Fiscal"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8081}"
      ASSET_URL: "${ASSET_URL:-http://localhost:8081}"
      APP_ROUTE_PREFIX: "${APP_ROUTE_PREFIX:-}"
      APP_TIMEZONE: America/Sao_Paulo
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-hibrido}"
      DB_USERNAME: "${DB_USERNAME:-hibrido}"
      DB_PASSWORD: "${DB_PASSWORD}"
      LEGACY_SQLITE_PATH: /var/www/html/legacy/database.sqlite
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      CACHE_STORE: database
      PASSWORD_RECOVERY_ENABLED: "${PASSWORD_RECOVERY_ENABLED:-false}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hibrido@localhost}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Híbrido | Mix Fiscal}"
    volumes:
      - hibrido_laravel_data:/var/www/html/legacy:ro
    depends_on:
      - postgres
  queue_worker:
    build: .
    restart: unless-stopped
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=120
    environment: &app_environment
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8081}"
      APP_ROUTE_PREFIX: "${APP_ROUTE_PREFIX:-}"
      APP_TIMEZONE: America/Sao_Paulo
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-hibrido}"
      DB_USERNAME: "${DB_USERNAME:-hibrido}"
      DB_PASSWORD: "${DB_PASSWORD}"
      QUEUE_CONNECTION: database
      SKIP_MIGRATIONS: "true"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hibrido@localhost}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Híbrido | Mix Fiscal}"
    depends_on:
      - postgres
  scheduler:
    build: .
    restart: unless-stopped
    command: php artisan schedule:work
    environment: *app_environment
    depends_on:
      - postgres
volumes:
  hibrido_laravel_data:
  hibrido_postgres_data:
