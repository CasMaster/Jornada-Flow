services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: "${POSTGRES_CONTAINER_NAME:-hibrido-home-office-postgres}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-hibrido}"
      POSTGRES_USER: "${DB_USERNAME:-hibrido}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - hibrido_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hibrido} -d ${DB_DATABASE:-hibrido}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hibrido_laravel:
    build: .
    container_name: "${APP_CONTAINER_NAME:-hibrido-home-office-laravel}"
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8081}:80"
    environment:
      APP_NAME: "${APP_NAME:-Jornada Flow}"
      BRAND_NAME: "${BRAND_NAME:-Jornada Flow}"
      BRAND_COMPANY: "${BRAND_COMPANY:-}"
      BRAND_INITIALS: "${BRAND_INITIALS:-JF}"
      BRAND_TAGLINE: "${BRAND_TAGLINE:-Controle simples. Trabalho flexível.}"
      BRAND_DESCRIPTION: "${BRAND_DESCRIPTION:-Solicitações e acompanhamento de home office e férias.}"
      BRAND_THEME_COLOR: "${BRAND_THEME_COLOR:-#071424}"
      BRAND_ACCENT_COLOR: "${BRAND_ACCENT_COLOR:-#147b34}"
      BRAND_LOGO: "${BRAND_LOGO:-assets/jornada-flow-logo.png}"
      BRAND_LOGIN_LOGO: "${BRAND_LOGIN_LOGO:-assets/jornada-flow-logo.png}"
      BRAND_MARK: "${BRAND_MARK:-assets/jornada-flow-mark.png}"
      BRAND_FAVICON: "${BRAND_FAVICON:-assets/jornada-flow-favicon.png}"
      BRAND_FAVICON_MIME: "${BRAND_FAVICON_MIME:-image/png}"
      BRAND_ICON_192: "${BRAND_ICON_192:-assets/icons/jornada-flow-192.png}"
      BRAND_ICON_512: "${BRAND_ICON_512:-assets/icons/jornada-flow-512.png}"
      BRAND_MASKABLE_ICON_512: "${BRAND_MASKABLE_ICON_512:-assets/icons/jornada-flow-maskable-512.png}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8081}"
      ASSET_URL: "${ASSET_URL:-http://localhost:8081}"
      APP_ROUTE_PREFIX: "${APP_ROUTE_PREFIX:-}"
      APP_TIMEZONE: America/Sao_Paulo
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-hibrido}"
      DB_USERNAME: "${DB_USERNAME:-hibrido}"
      DB_PASSWORD: "${DB_PASSWORD}"
      LEGACY_SQLITE_PATH: /var/www/html/legacy/database.sqlite
      SESSION_DRIVER: database
      SESSION_COOKIE: "${SESSION_COOKIE:-hibrido-mix-fiscal-session}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      CACHE_STORE: database
      PASSWORD_RECOVERY_ENABLED: "${PASSWORD_RECOVERY_ENABLED:-false}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      OIDC_LOGOUT_REDIRECT_URI: "${OIDC_LOGOUT_REDIRECT_URI:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      OIDC_SIGNING_ALGORITHM: "${OIDC_SIGNING_ALGORITHM:-RS256}"
      HOLIDAYS_API_URL: "${HOLIDAYS_API_URL:-https://feriadosapi.com}"
      HOLIDAYS_API_TOKEN: "${HOLIDAYS_API_TOKEN:-}"
      HOLIDAYS_STATE: "${HOLIDAYS_STATE:-SP}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SLOW_REQUEST_MS: "${SLOW_REQUEST_MS:-750}"
      SLOW_QUERY_MS: "${SLOW_QUERY_MS:-250}"
      DATA_RETENTION_ENABLED: "${DATA_RETENTION_ENABLED:-false}"
      DEPLOY_APPROVAL_ENV: "${DEPLOY_APPROVAL_ENV:-}"
      DEPLOY_APPROVAL_KEY: "${DEPLOY_APPROVAL_KEY:-}"
      MAIL_NOTIFICATIONS_ENABLED: "${MAIL_NOTIFICATIONS_ENABLED:-false}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hibrido@localhost}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-MixHome | Mix Fiscal}"
    volumes:
      - hibrido_laravel_data:/var/www/html/legacy:ro
      - "${DEPLOY_PENDING_HOST_DIR:-./storage/deploy-pending}:/run/mixhome-ci/pending:ro"
      - "${DEPLOY_APPROVED_HOST_DIR:-./storage/deploy-approved}:/run/mixhome-ci/web-approved:rw"
    depends_on:
      - postgres
  queue_worker:
    build: .
    restart: unless-stopped
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=120
    environment: &app_environment
      APP_NAME: "${APP_NAME:-Jornada Flow}"
      BRAND_NAME: "${BRAND_NAME:-Jornada Flow}"
      BRAND_COMPANY: "${BRAND_COMPANY:-}"
      BRAND_INITIALS: "${BRAND_INITIALS:-JF}"
      BRAND_TAGLINE: "${BRAND_TAGLINE:-Controle simples. Trabalho flexível.}"
      BRAND_DESCRIPTION: "${BRAND_DESCRIPTION:-Solicitações e acompanhamento de home office e férias.}"
      BRAND_THEME_COLOR: "${BRAND_THEME_COLOR:-#071424}"
      BRAND_ACCENT_COLOR: "${BRAND_ACCENT_COLOR:-#147b34}"
      BRAND_LOGO: "${BRAND_LOGO:-assets/jornada-flow-logo.png}"
      BRAND_LOGIN_LOGO: "${BRAND_LOGIN_LOGO:-assets/jornada-flow-logo.png}"
      BRAND_MARK: "${BRAND_MARK:-assets/jornada-flow-mark.png}"
      BRAND_FAVICON: "${BRAND_FAVICON:-assets/jornada-flow-favicon.png}"
      BRAND_FAVICON_MIME: "${BRAND_FAVICON_MIME:-image/png}"
      BRAND_ICON_192: "${BRAND_ICON_192:-assets/icons/jornada-flow-192.png}"
      BRAND_ICON_512: "${BRAND_ICON_512:-assets/icons/jornada-flow-512.png}"
      BRAND_MASKABLE_ICON_512: "${BRAND_MASKABLE_ICON_512:-assets/icons/jornada-flow-maskable-512.png}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8081}"
      APP_ROUTE_PREFIX: "${APP_ROUTE_PREFIX:-}"
      APP_TIMEZONE: America/Sao_Paulo
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-hibrido}"
      DB_USERNAME: "${DB_USERNAME:-hibrido}"
      DB_PASSWORD: "${DB_PASSWORD}"
      QUEUE_CONNECTION: database
      SKIP_MIGRATIONS: "true"
      HOLIDAYS_API_URL: "${HOLIDAYS_API_URL:-https://feriadosapi.com}"
      HOLIDAYS_API_TOKEN: "${HOLIDAYS_API_TOKEN:-}"
      HOLIDAYS_STATE: "${HOLIDAYS_STATE:-SP}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SLOW_REQUEST_MS: "${SLOW_REQUEST_MS:-750}"
      SLOW_QUERY_MS: "${SLOW_QUERY_MS:-250}"
      DATA_RETENTION_ENABLED: "${DATA_RETENTION_ENABLED:-false}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      OIDC_LOGOUT_REDIRECT_URI: "${OIDC_LOGOUT_REDIRECT_URI:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      OIDC_SIGNING_ALGORITHM: "${OIDC_SIGNING_ALGORITHM:-RS256}"
      MAIL_NOTIFICATIONS_ENABLED: "${MAIL_NOTIFICATIONS_ENABLED:-false}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hibrido@localhost}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-MixHome | Mix Fiscal}"
    depends_on:
      - postgres
  scheduler:
    build: .
    restart: unless-stopped
    command: php artisan schedule:work
    environment: *app_environment
    depends_on:
      - postgres
volumes:
  hibrido_laravel_data:
  hibrido_postgres_data:
